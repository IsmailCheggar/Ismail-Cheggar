<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ismail Cheggar</title>


<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Inter', sans-serif;
    background: #f4f7f6;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    color: #333;
}


.login-box {
    background: white;
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    text-align: center;
    width: 340px;
    transition: transform 0.1s ease-in-out;
}

.login-box h2 {
    margin-bottom: 5px;
    font-weight: 600;
    color: #1a1a1a;
}

.login-box p.subtitle {
    font-size: 14px;
    color: #666;
    margin-bottom: 25px;
}


.input-group {
    margin-bottom: 15px;
    text-align: left;
}

input {
    width: 100%;
    padding: 14px;
    border-radius: 8px;
    border: 1px solid #d1d5db;
    background-color: #f9fafb;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    transition: all 0.3s ease;
}

input:focus {
    outline: none;
    border-color: #0056b3;
    box-shadow: 0 0 0 3px rgba(0, 86, 179, 0.1);
    background-color: white;
}


button {
    padding: 14px;
    width: 100%;
    background: #0f172a; 
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    font-size: 16px;
    transition: background 0.3s ease;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 50px;
}

button:hover {
    background: #1e293b;
}

button:disabled {
    background: #94a3b8;
    cursor: not-allowed;
}


.spinner {
    display: none;
    width: 20px;
    height: 20px;
    border: 3px solid rgba(255,255,255,0.3);
    border-radius: 50%;
    border-top-color: white;
    animation: spin 1s ease-in-out infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}


#message {
    margin-top: 20px;
    font-weight: 500;
    font-size: 14px;
    min-height: 20px; 
}

.success { color: #10b981; } 
.error { color: #ef4444; }   


@keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-8px); }
    40%, 80% { transform: translateX(8px); }
}

.shake {
    animation: shake 0.4s ease-in-out;
}

</style>
</head>

<body>

<div class="login-box" id="loginBox">
    <h2>Willkommen</h2>
    <p class="subtitle">Bitte melden Sie sich an</p>

    <div class="input-group">
        <input type="text" id="username" placeholder="Benutzername(ismail) ">
    </div>
    
    <div class="input-group">
        <input type="password" id="password" placeholder="Passwort(1234) ">
    </div>

    <button onclick="login()" id="loginBtn">
        <span id="btnText">Anmelden</span>
        <div class="spinner" id="spinner"></div>
    </button>

    <p id="message"></p>
</div>

<script>

document.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        login();
    }
});

function login() {
    let user = document.getElementById("username").value;
    let pass = document.getElementById("password").value;
    
    let message = document.getElementById("message");
    let loginBox = document.getElementById("loginBox");
    
    let loginBtn = document.getElementById("loginBtn");
    let btnText = document.getElementById("btnText");
    let spinner = document.getElementById("spinner");

    
    message.innerHTML = "";
    message.className = "";
    loginBox.classList.remove("shake");

    
    btnText.style.display = "none";
    spinner.style.display = "block";
    loginBtn.disabled = true;

    
    setTimeout(() => {
    
        btnText.style.display = "block";
        spinner.style.display = "none";
        loginBtn.disabled = false;


        if(user === "ismail" && pass === "1234"){
            message.innerHTML = "Anmeldung erfolgreich !";
            message.className = "success";
        } else {
            message.innerHTML = "Falscher Benutzername oder Passwort !";
            message.className = "error";
            
            
            loginBox.classList.add("shake");
            
           
            setTimeout(() => {
                loginBox.classList.remove("shake");
            }, 400);
        }
    }, 1500); 
}
</script>

</body>
</html>
